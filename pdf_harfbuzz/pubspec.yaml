name: pdf_harfbuzz
description: A companion package for dart_pdf that provides HarfBuzz text shaping for complex scripts.
version: 0.1.0
homepage: https://github.com/DavBfr/dart_pdf/tree/master/pdf_harfbuzz
repository: https://github.com/DavBfr/dart_pdf
issue_tracker: https://github.com/DavBfr/dart_pdf/issues
topics:
  - pdf
  - harfbuzz
  - shaping
  - text
  - typography

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  pdf: ^3.13.0
  ffi: ^2.2.0
  meta: ">=1.3.0 <2.0.0"

dev_dependencies:
  lints: ^5.0.0
  test: ">=1.16.0 <2.0.0"

dependency_overrides:
  pdf:
    path: ../pdf
